# Nginx na VPS: bloco do site do Dá Tempo?. Troque o domínio e gere o certificado com:
#   sudo certbot --nginx -d datempo.seudominio.com.br
server {
    listen 80;
    server_name datempo.seudominio.com.br;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # a Lia pode levar alguns segundos quando chama várias ferramentas
    }
}
